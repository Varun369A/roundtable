global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'sabha-dev'

scrape_configs:
  # Arivarangam API — exposes /metrics via prom-client
  - job_name: 'arivarangam-api'
    static_configs:
      - targets: ['host.docker.internal:3001']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # BullMQ / Valkey — use bull-exporter sidecar if enabled
  # - job_name: 'bullmq'
  #   static_configs:
  #     - targets: ['bull-exporter:9538']

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
