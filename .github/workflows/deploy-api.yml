name: Deploy API to EC2

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            # Ensure swap is active (2GB) so tsc doesn't OOM
            if [ "$(sudo swapon --show | wc -l)" -eq 0 ]; then
              sudo fallocate -l 2G /swapfile 2>/dev/null || true
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
            fi

            cd /home/ubuntu/roundtable
            git pull origin main
            npm install
            npx prisma generate --schema=packages/db/prisma/schema.prisma
            cd packages/types && npx tsc --outDir dist --rootDir src --declaration --skipLibCheck || true && cd ../..
            cd packages/config && npx tsc --outDir dist --rootDir src --declaration --skipLibCheck || true && cd ../..
            cd packages/db && npx tsc --outDir dist --rootDir src --declaration --skipLibCheck || true && cd ../..
            cd apps/api && NODE_OPTIONS="--max-old-space-size=3072" npx tsc --skipLibCheck || true
            pm2 restart arivarangam-api
            echo "Deployed successfully"
