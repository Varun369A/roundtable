<svg viewBox="0 0 256 40" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- Three-node triad mark (same geometry as favicon, no background) -->
  <line x1="14" y1="8" x2="7" y2="20" stroke="#6366f1" stroke-width="1.4" stroke-opacity="0.45"/>
  <line x1="14" y1="8" x2="21" y2="20" stroke="#6366f1" stroke-width="1.4" stroke-opacity="0.45"/>
  <line x1="7.5" y1="20" x2="20.5" y2="20" stroke="#6366f1" stroke-width="1.4" stroke-opacity="0.45"/>
  <!-- Top node -->
  <circle cx="14" cy="8" r="2.4" fill="#6366f1"/>
  <!-- Bottom-left node -->
  <circle cx="7" cy="20" r="2.4" fill="#6366f1" fill-opacity="0.65"/>
  <!-- Bottom-right node -->
  <circle cx="21" cy="20" r="2.4" fill="#6366f1" fill-opacity="0.65"/>

  <!-- Wordmark: "Ariv" + "ar" (indigo) + "angam" -->
  <text
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif"
    font-weight="700"
    font-size="22"
    dominant-baseline="middle"
    y="21"
  >
    <tspan x="34" fill="#1e293b">Ariv</tspan><tspan fill="#6366f1">ar</tspan><tspan fill="#1e293b">angam</tspan>
  </text>
</svg>
