<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Subtle rounded rect background -->
  <rect width="32" height="32" rx="7" fill="#f8fafc"/>

  <!-- Connecting lines (thin, subtle) -->
  <!-- Hexagon edges -->
  <line x1="16" y1="5"  x2="25.33" y2="10.5" stroke="#cbd5e1" stroke-width="0.8" stroke-opacity="0.7"/>
  <line x1="25.33" y1="10.5" x2="25.33" y2="21.5" stroke="#cbd5e1" stroke-width="0.8" stroke-opacity="0.7"/>
  <line x1="25.33" y1="21.5" x2="16" y2="27"  stroke="#cbd5e1" stroke-width="0.8" stroke-opacity="0.7"/>
  <line x1="16" y1="27"  x2="6.67" y2="21.5" stroke="#cbd5e1" stroke-width="0.8" stroke-opacity="0.7"/>
  <line x1="6.67" y1="21.5" x2="6.67" y2="10.5" stroke="#cbd5e1" stroke-width="0.8" stroke-opacity="0.7"/>
  <line x1="6.67" y1="10.5" x2="16" y2="5"   stroke="#cbd5e1" stroke-width="0.8" stroke-opacity="0.7"/>

  <!-- Cross-lines (spoke diagonals) -->
  <line x1="16" y1="5"  x2="25.33" y2="21.5" stroke="#e2e8f0" stroke-width="0.6" stroke-opacity="0.5"/>
  <line x1="16" y1="5"  x2="6.67"  y2="21.5" stroke="#e2e8f0" stroke-width="0.6" stroke-opacity="0.5"/>
  <line x1="16" y1="5"  x2="16"    y2="27"   stroke="#e2e8f0" stroke-width="0.6" stroke-opacity="0.5"/>
  <line x1="25.33" y1="10.5" x2="6.67" y2="21.5"  stroke="#e2e8f0" stroke-width="0.6" stroke-opacity="0.5"/>
  <line x1="25.33" y1="10.5" x2="16"   y2="27"    stroke="#e2e8f0" stroke-width="0.6" stroke-opacity="0.5"/>
  <line x1="25.33" y1="10.5" x2="6.67" y2="10.5"  stroke="#e2e8f0" stroke-width="0.6" stroke-opacity="0.5"/>
  <line x1="25.33" y1="21.5" x2="6.67" y2="10.5"  stroke="#e2e8f0" stroke-width="0.6" stroke-opacity="0.5"/>
  <line x1="25.33" y1="21.5" x2="6.67" y2="21.5"  stroke="#e2e8f0" stroke-width="0.6" stroke-opacity="0.5"/>
  <line x1="16"    y1="27"   x2="6.67" y2="10.5"  stroke="#e2e8f0" stroke-width="0.6" stroke-opacity="0.5"/>

  <!-- 6 dots at radius ~11 from center (16,16) -->
  <!-- Dot 1: top — indigo — (16, 5) -->
  <circle cx="16"    cy="5"    r="2.8" fill="#6366f1"/>
  <!-- Dot 2: top-right — purple — (25.33, 10.5) -->
  <circle cx="25.33" cy="10.5" r="2.8" fill="#8b5cf6"/>
  <!-- Dot 3: bottom-right — blue — (25.33, 21.5) -->
  <circle cx="25.33" cy="21.5" r="2.8" fill="#3b82f6"/>
  <!-- Dot 4: bottom — emerald — (16, 27) -->
  <circle cx="16"    cy="27"   r="2.8" fill="#10b981"/>
  <!-- Dot 5: bottom-left — amber — (6.67, 21.5) -->
  <circle cx="6.67"  cy="21.5" r="2.8" fill="#f59e0b"/>
  <!-- Dot 6: top-left — rose — (6.67, 10.5) -->
  <circle cx="6.67"  cy="10.5" r="2.8" fill="#f43f5e"/>
</svg>
