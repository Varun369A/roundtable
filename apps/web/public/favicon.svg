<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- Indigo rounded background -->
  <rect width="32" height="32" rx="7" fill="#6366f1"/>
  <!-- Three-node triad mark — multi-AI roundtable symbol -->
  <line x1="16" y1="11" x2="10" y2="21.5" stroke="white" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="16" y1="11" x2="22" y2="21.5" stroke="white" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="10.5" y1="21.5" x2="21.5" y2="21.5" stroke="white" stroke-width="1.5" stroke-opacity="0.5"/>
  <!-- Top node: brightest -->
  <circle cx="16" cy="11" r="2.5" fill="white"/>
  <!-- Bottom-left node -->
  <circle cx="10" cy="21.5" r="2.5" fill="white" fill-opacity="0.8"/>
  <!-- Bottom-right node -->
  <circle cx="22" cy="21.5" r="2.5" fill="white" fill-opacity="0.8"/>
</svg>
