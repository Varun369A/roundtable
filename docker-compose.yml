version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sabha_postgres
    environment:
      POSTGRES_USER: sabha
      POSTGRES_PASSWORD: sabha_dev
      POSTGRES_DB: sabha_db
    ports:
      - "5432:5432"
    volumes:
      - sabha_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sabha"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sabha_redis
    ports:
      - "6379:6379"
    volumes:
      - sabha_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sabha_postgres_data:
  sabha_redis_data:
